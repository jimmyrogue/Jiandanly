name: Release Client

on:
  push:
    tags: ["client-v*"]
    branches: [main]
    paths:
      - .github/workflows/release-client.yml
      - pnpm-lock.yaml
      - runtime/plugins/browser-qa/**
      - runtime/plugins/computer-use/**
      - runtime/plugins/ocr/**
      - runtime/pyproject.toml
      - runtime/src/shejane_runtime/plugins/**
      - runtime/uv.lock
      - scripts/build-browser-qa-builtin.sh
      - scripts/build-browser-qa-windows-amd64.ps1
      - scripts/build-computer-use-builtin.sh
      - scripts/build-ocr-builtin.sh
      - scripts/build-ocr-windows-amd64.ps1
      - scripts/test-packaged-runtime-upgrade.mjs
  workflow_dispatch:
    inputs:
      extended_asset_verification:
        description: Build and inspect optional Linux arm64 Runtime Assets and Workers
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  agent-eval-gate:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock
      - name: Install Runtime dependencies
        working-directory: runtime
        run: uv sync --frozen
      - name: Gate release on deterministic Agent outcomes
        run: make eval-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-gate
          path: .tmp/eval-gate.xml
          if-no-files-found: error

  linux-arm64-runtime:
    if: inputs.extended_asset_verification == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Install Linux Runtime build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - name: Fetch and build verified bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          lock="runtime/native/managed-worker-linux/bubblewrap-0.11.2.lock.json"
          source="${RUNNER_TEMP}/bubblewrap-0.11.2.tar.xz"
          curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "$(jq -r '.source.url' "${lock}")" --output "${source}"
          python - "${source}" "${lock}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          expected = json.loads(Path(sys.argv[2]).read_text())["source"]
          assert len(raw) == expected["size_bytes"]
          assert hashlib.sha256(raw).hexdigest() == expected["sha256"]
          PY
          output="${PWD}/runtime/build/managed-worker-linux/bubblewrap"
          mkdir -p "${output}"
          docker run --rm \
            -v "${PWD}:/workspace:ro" \
            -v "${source}:/inputs/bubblewrap.tar.xz:ro" \
            -v "${output}:/output" \
            debian@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
            sh -euc '
              apt-get update -qq
              apt-get install -y -qq gcc libcap-dev meson ninja-build pkg-config python3 xz-utils
              /workspace/scripts/build-linux-bubblewrap.sh \
                /inputs/bubblewrap.tar.xz /output
            '
      - name: Build packaged Linux arm64 Runtime
        run: make package-runtime
      - name: Verify packaged Runtime and cgroup launcher
        shell: bash
        run: |
          set -euo pipefail
          runtime="runtime/dist/shejane-runtime/shejane-runtime"
          launcher="$(find runtime/dist/shejane-runtime -type f \
            -name shejane-managed-worker-linux -print -quit)"
          bubblewrap="$(find runtime/dist/shejane-runtime -type f \
            -name shejane-bwrap -print -quit)"
          test -x "${runtime}"
          test -x "${launcher}"
          test -x "${bubblewrap}"
          test -f "$(dirname "${bubblewrap}")/libcap.so.2"
          "${runtime}" --help >/dev/null
          "${launcher}" --help >/dev/null
          "${bubblewrap}" --version | grep -Fx 'bubblewrap 0.11.2'
          printf '%s' "${launcher}" > "${RUNNER_TEMP}/shejane-linux-launcher-path"
          printf '%s' "${bubblewrap}" > "${RUNNER_TEMP}/shejane-linux-bubblewrap-path"
      - name: Build Linux native sandbox fixture
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -trimpath -buildvcs=false -ldflags='-s -w -buildid=' \
            -o "${RUNNER_TEMP}/shejane-linux-sandbox-worker" \
            runtime/tests/fixtures/managed_worker_linux/main.go
      - name: Run packaged Linux cgroup v2 Gate
        shell: bash
        run: |
          set -euo pipefail
          launcher="$(cat "${RUNNER_TEMP}/shejane-linux-launcher-path")"
          bubblewrap="$(cat "${RUNNER_TEMP}/shejane-linux-bubblewrap-path")"
          bubblewrap_dir="$(dirname "${bubblewrap}")"
          image="python:3.12.10-slim-bookworm@sha256:79082fdf411b897d64983893f44e8e1908e21cade2fc5a794d4f46de76c85275"
          docker run --rm --privileged --cgroupns=host \
            -v "${PWD}:/workspace:ro" \
            -v "${PWD}/${launcher}:/launcher:ro" \
            -v "${PWD}/${bubblewrap_dir}:/managed-worker-linux:ro" \
            -v "${RUNNER_TEMP}/shejane-linux-sandbox-worker:/sandbox-worker:ro" \
            -e PYTHONPATH=/workspace/runtime/src \
            -e SHEJANE_TEST_LINUX_CGROUP_LAUNCHER=/launcher \
            -e SHEJANE_TEST_LINUX_CGROUP_ROOT=/sys/fs/cgroup \
            -e SHEJANE_TEST_LINUX_BUBBLEWRAP=/managed-worker-linux/shejane-bwrap \
            -e SHEJANE_TEST_LINUX_SANDBOX_WORKER=/sandbox-worker \
            "${image}" sh -eu -c '
              cd /tmp
              pip install --disable-pip-version-check --no-cache-dir -q \
                pytest==9.0.3 pytest-asyncio==1.3.0 wasmtime==46.0.1
              cd /workspace/runtime
              pytest -q --noconftest -p no:cacheprovider \
                tests/test_managed_worker_linux.py
            '
      - name: Run packaged Linux systemd delegation Gate
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find runtime/dist/shejane-runtime -type f \
            -path '*/managed-worker-linux/manifest.json' -print -quit)"
          launcher="$(cat "${RUNNER_TEMP}/shejane-linux-launcher-path")"
          bubblewrap="$(cat "${RUNNER_TEMP}/shejane-linux-bubblewrap-path")"
          portable_root="/tmp/shejane-runtime-systemd-gate"
          sudo install -d -m 0755 "${portable_root}/_internal"
          sudo cp "${launcher}" "${portable_root}/_internal/shejane-managed-worker-linux"
          sudo cp -R "$(dirname "${bubblewrap}")" \
            "${portable_root}/_internal/managed-worker-linux"
          sudo chmod -R a+rX "${portable_root}"
          portable_manifest="${portable_root}/_internal/managed-worker-linux/manifest.json"
          python="$(cd runtime && uv run which python)"
          test -f "${manifest}"
          test -f "${portable_manifest}"
          sudo systemd-run --quiet --wait --pipe --collect --service-type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=supervisor \
            --working-directory="${PWD}/runtime" \
            /usr/bin/env \
              "PYTHONPATH=${PWD}/runtime/src" \
              "SHEJANE_TEST_LINUX_ASSET_MANIFEST=${portable_manifest}" \
              "SHEJANE_TEST_LINUX_SANDBOX_WORKER=${RUNNER_TEMP}/shejane-linux-sandbox-worker" \
              "${python}" -m pytest -q --noconftest -p no:cacheprovider \
                tests/test_managed_worker_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-arm64
          path: runtime/dist/shejane-runtime
          if-no-files-found: error

  linux-arm64-node-runtime:
    if: inputs.extended_asset_verification == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch locked Node.js runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          lock="runtime/plugins/runtime-assets/node/node-24.18.0-linux-arm64.lock.json"
          inputs="${RUNNER_TEMP}/shejane-node-runtime-inputs"
          mkdir -p "${inputs}"
          fetch() {
            local query="$1"
            local output="$2"
            curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
              "$(jq -r "${query}" "${lock}")" --output "${inputs}/${output}"
          }
          fetch '.node.url' node.tar.xz
          fetch '.signed_checksums.url' SHASUMS256.txt.asc
          fetch '.release_keyring.url' pubring.kbx
      - name: Build reproducible Linux arm64 Node.js Runtime Asset
        shell: bash
        run: |
          set -euo pipefail
          inputs="${RUNNER_TEMP}/shejane-node-runtime-inputs"
          first="${RUNNER_TEMP}/org.nodejs.runtime-linux-arm64-a.shejane-runtime-asset"
          second="${RUNNER_TEMP}/org.nodejs.runtime-linux-arm64-b.shejane-runtime-asset"
          for output in "${first}" "${second}"; do
            python runtime/plugins/runtime-assets/node/build_linux_arm64.py \
              --node-archive "${inputs}/node.tar.xz" \
              --signed-checksums "${inputs}/SHASUMS256.txt.asc" \
              --release-keyring "${inputs}/pubring.kbx" \
              --output "${output}"
          done
          cmp "${first}" "${second}"
          mkdir "${RUNNER_TEMP}/node-runtime-probe"
          unzip -q "${first}" -d "${RUNNER_TEMP}/node-runtime-probe"
          test "$("${RUNNER_TEMP}/node-runtime-probe/payload/bin/node" --version)" = "v24.18.0"
      - uses: actions/upload-artifact@v4
        with:
          name: node-runtime-linux-arm64
          path: ${{ runner.temp }}/org.nodejs.runtime-linux-arm64-a.shejane-runtime-asset
          if-no-files-found: error

  linux-arm64-office-runtime:
    if: inputs.extended_asset_verification == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch locked Office Runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          lock="runtime/plugins/office/runtime-assets/libreoffice-25.8.7.lock.json"
          inputs="${RUNNER_TEMP}/shejane-office-runtime-inputs"
          mkdir -p "${inputs}"
          fetch() {
            local query="$1"
            local output="$2"
            curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
              "$(jq -r "${query}" "${lock}")" --output "${inputs}/${output}"
          }
          fetch '.libreoffice.platforms["linux/arm64"].url' libreoffice.tar.gz
          fetch '.libreoffice.platforms["linux/arm64"].signature.url' libreoffice.tar.gz.asc
          fetch '.pdf_renderer.source_url' mupdf-source.tar.gz
          fetch '.font_baseline.url' noto-cjk.zip
      - name: Build reproducible Linux arm64 Office Runtime Asset
        shell: bash
        run: |
          set -euo pipefail
          inputs="${RUNNER_TEMP}/shejane-office-runtime-inputs"
          first="${RUNNER_TEMP}/office-runtime-linux-arm64-a.shejane-runtime-asset"
          second="${RUNNER_TEMP}/office-runtime-linux-arm64-b.shejane-runtime-asset"
          for output in "${first}" "${second}"; do
            python runtime/plugins/office/runtime-assets/build_linux_arm64.py \
              --libreoffice-archive "${inputs}/libreoffice.tar.gz" \
              --libreoffice-signature "${inputs}/libreoffice.tar.gz.asc" \
              --mupdf-source "${inputs}/mupdf-source.tar.gz" \
              --noto-cjk "${inputs}/noto-cjk.zip" \
              --output "${output}"
          done
          cmp "${first}" "${second}"
      - uses: actions/upload-artifact@v4
        with:
          name: office-runtime-linux-arm64
          path: ${{ runner.temp }}/office-runtime-linux-arm64-a.shejane-runtime-asset
          if-no-files-found: error

  linux-arm64-pdf-runtime:
    if: inputs.extended_asset_verification == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch locked MuPDF Runtime source
        shell: bash
        run: |
          set -euo pipefail
          lock="runtime/plugins/pdf/runtime-assets/mupdf-1.27.2.lock.json"
          curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "$(jq -r '.upstream.source_url' "${lock}")" \
            --output "${RUNNER_TEMP}/mupdf-1.27.2-source.tar.gz"
      - name: Build reproducible Linux arm64 MuPDF Runtime Asset
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/mupdf-runtime-linux-arm64-a.shejane-runtime-asset"
          second="${RUNNER_TEMP}/mupdf-runtime-linux-arm64-b.shejane-runtime-asset"
          for output in "${first}" "${second}"; do
            python runtime/plugins/pdf/runtime-assets/build_linux_arm64.py \
              --source "${RUNNER_TEMP}/mupdf-1.27.2-source.tar.gz" \
              --output "${output}"
          done
          cmp "${first}" "${second}"
      - uses: actions/upload-artifact@v4
        with:
          name: mupdf-runtime-linux-arm64
          path: ${{ runner.temp }}/mupdf-runtime-linux-arm64-a.shejane-runtime-asset
          if-no-files-found: error

  linux-arm64-ffmpeg-runtime:
    if: inputs.extended_asset_verification == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch authenticated FFmpeg Runtime source
        shell: bash
        run: |
          set -euo pipefail
          lock="runtime/plugins/media-foundation/runtime-assets/ffmpeg-8.1.2.lock.json"
          inputs="${RUNNER_TEMP}/shejane-ffmpeg-runtime-inputs"
          mkdir -p "${inputs}"
          fetch() {
            local query="$1"
            local output="$2"
            curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
              "$(jq -r "${query}" "${lock}")" --output "${inputs}/${output}"
          }
          fetch '.upstream.source_url' ffmpeg-8.1.2.tar.xz
          fetch '.upstream.signature_url' ffmpeg-8.1.2.tar.xz.asc
          fetch '.upstream.signing_key_url' ffmpeg-devel.asc
      - name: Build reproducible Linux arm64 FFmpeg Runtime Asset
        shell: bash
        run: |
          set -euo pipefail
          inputs="${RUNNER_TEMP}/shejane-ffmpeg-runtime-inputs"
          first="${RUNNER_TEMP}/ffmpeg-runtime-linux-arm64-a.shejane-runtime-asset"
          second="${RUNNER_TEMP}/ffmpeg-runtime-linux-arm64-b.shejane-runtime-asset"
          for output in "${first}" "${second}"; do
            python runtime/plugins/media-foundation/runtime-assets/build_linux_arm64.py \
              --source "${inputs}/ffmpeg-8.1.2.tar.xz" \
              --signature "${inputs}/ffmpeg-8.1.2.tar.xz.asc" \
              --signing-key "${inputs}/ffmpeg-devel.asc" \
              --output "${output}"
          done
          cmp "${first}" "${second}"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-runtime-linux-arm64
          path: ${{ runner.temp }}/ffmpeg-runtime-linux-arm64-a.shejane-runtime-asset
          if-no-files-found: error

  linux-arm64-ocr-runtime:
    if: inputs.extended_asset_verification == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch content-locked OCR packages and models
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/shejane-ocr-wheelhouse"
          models="${RUNNER_TEMP}/shejane-ocr-models"
          mkdir -p "${wheelhouse}" "${models}"
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          root = Path.cwd()
          wheelhouse = Path(os.environ["RUNNER_TEMP"]) / "shejane-ocr-wheelhouse"
          lock = json.loads(
              (root / "runtime/plugins/ocr/runtime-assets/rapidocr-3.9.1-linux-arm64.lock.json").read_text()
          )
          for item in lock["packages"]:
              filename = item["filename"]
              project = (
                  "antlr4-python3-runtime"
                  if filename.startswith("antlr4-python3-runtime-")
                  else filename.split("-", 1)[0].replace("_", "-")
              )
              with urllib.request.urlopen(f"https://pypi.org/pypi/{project}/json") as response:
                  metadata = json.load(response)
              candidates = [
                  file
                  for release in metadata["releases"].values()
                  for file in release
                  if file["filename"] == filename
              ]
              if len(candidates) != 1:
                  raise SystemExit(f"locked PyPI file is unavailable: {filename}")
              urllib.request.urlretrieve(candidates[0]["url"], wheelhouse / filename)
          PY
          while IFS=$'\t' read -r url filename; do
            curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
              "${url}" --output "${models}/${filename}"
          done < <(jq -r '.models[] | [.source_url, .filename] | @tsv' \
            runtime/plugins/ocr/runtime-assets/rapidocr-3.9.1.lock.json)
      - name: Build reproducible Linux arm64 RapidOCR Runtime Asset
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/rapidocr-runtime-linux-arm64-a.shejane-runtime-asset"
          second="${RUNNER_TEMP}/rapidocr-runtime-linux-arm64-b.shejane-runtime-asset"
          for output in "${first}" "${second}"; do
            python runtime/plugins/ocr/runtime-assets/build_linux_arm64.py \
              --wheelhouse "${RUNNER_TEMP}/shejane-ocr-wheelhouse" \
              --model-dir "${RUNNER_TEMP}/shejane-ocr-models" \
              --output "${output}"
          done
          cmp "${first}" "${second}"
      - uses: actions/upload-artifact@v4
        with:
          name: rapidocr-runtime-linux-arm64
          path: ${{ runner.temp }}/rapidocr-runtime-linux-arm64-a.shejane-runtime-asset
          if-no-files-found: error

  darwin-arm64-ocr-runtime:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore macOS RapidOCR Runtime Asset
        id: rapidocr-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rapidocr-runtime-darwin-arm64-a.shejane-runtime-asset
          key: release-asset-v1-darwin-arm64-rapidocr-${{ hashFiles('runtime/plugins/ocr/runtime-assets/rapidocr-3.9.1.lock.json', 'runtime/plugins/ocr/runtime-assets/build_darwin.py', 'runtime/plugins/ocr/runtime-assets/ocr_engine.py') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.14"
      - name: Fetch content-locked macOS OCR packages and models
        if: steps.rapidocr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/shejane-ocr-wheelhouse"
          models="${RUNNER_TEMP}/shejane-ocr-models"
          mkdir -p "${wheelhouse}" "${models}"
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          root = Path.cwd()
          wheelhouse = Path(os.environ["RUNNER_TEMP"]) / "shejane-ocr-wheelhouse"
          lock = json.loads(
              (root / "runtime/plugins/ocr/runtime-assets/rapidocr-3.9.1.lock.json").read_text()
          )
          for item in lock["packages"]:
              filename = item["filename"]
              project = (
                  "antlr4-python3-runtime"
                  if filename.startswith("antlr4-python3-runtime-")
                  else filename.split("-", 1)[0].replace("_", "-")
              )
              with urllib.request.urlopen(f"https://pypi.org/pypi/{project}/json") as response:
                  metadata = json.load(response)
              candidates = [
                  file
                  for release in metadata["releases"].values()
                  for file in release
                  if file["filename"] == filename
              ]
              if len(candidates) != 1:
                  raise SystemExit(f"locked PyPI file is unavailable: {filename}")
              urllib.request.urlretrieve(candidates[0]["url"], wheelhouse / filename)
          PY
          while IFS=$'\t' read -r url filename; do
            curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
              "${url}" --output "${models}/${filename}"
          done < <(jq -r '.models[] | [.source_url, .filename] | @tsv' \
            runtime/plugins/ocr/runtime-assets/rapidocr-3.9.1.lock.json)
      - name: Build reproducible macOS arm64 RapidOCR Runtime Asset
        if: steps.rapidocr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/rapidocr-runtime-darwin-arm64-a.shejane-runtime-asset"
          second="${RUNNER_TEMP}/rapidocr-runtime-darwin-arm64-b.shejane-runtime-asset"
          for output in "${first}" "${second}"; do
            python runtime/plugins/ocr/runtime-assets/build_darwin.py \
              --wheelhouse "${RUNNER_TEMP}/shejane-ocr-wheelhouse" \
              --model-dir "${RUNNER_TEMP}/shejane-ocr-models" \
              --output "${output}"
          done
          cmp "${first}" "${second}"
      - name: Verify macOS arm64 RapidOCR Runtime Asset
        shell: bash
        run: |
          set -euo pipefail
          python - "${RUNNER_TEMP}/rapidocr-runtime-darwin-arm64-a.shejane-runtime-asset" <<'PY'
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("RapidOCR Runtime Asset cache is corrupt")
              manifest = json.loads(
                  archive.read(".shejane-runtime-asset/asset.json").decode("utf-8")
              )
          expected = {
              "id": "org.rapidocr.runtime",
              "version": "3.9.1+ppocrv6-small.1",
              "platform": "darwin/arm64",
          }
          if {key: manifest.get(key) for key in expected} != expected:
              raise SystemExit("RapidOCR Runtime Asset cache has the wrong identity")
          PY
      - name: Save macOS RapidOCR Runtime Asset
        if: github.ref == 'refs/heads/main' && steps.rapidocr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rapidocr-runtime-darwin-arm64-a.shejane-runtime-asset
          key: ${{ steps.rapidocr-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: rapidocr-runtime-darwin-arm64
          path: ${{ runner.temp }}/rapidocr-runtime-darwin-arm64-a.shejane-runtime-asset
          if-no-files-found: error
          retention-days: 1

  darwin-arm64-fixed-plugins:
    needs: darwin-arm64-ocr-runtime
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.14"
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock
      - name: Restore macOS fixed capabilities
        id: fixed-capabilities-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/shejane-fixed-capabilities
          key: release-asset-v1-darwin-arm64-fixed-capabilities-${{ hashFiles('pnpm-lock.yaml', 'runtime/pyproject.toml', 'runtime/uv.lock', 'runtime/src/shejane_runtime/plugins/**', 'scripts/build-browser-qa-builtin.sh', 'scripts/build-computer-use-builtin.sh', 'scripts/build-ocr-builtin.sh', 'runtime/plugins/browser-qa/**', 'runtime/plugins/computer-use/**', 'runtime/plugins/ocr/**') }}
      - name: Install fixed capability build dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          cd runtime
          uv sync --frozen
      - uses: actions/download-artifact@v4
        if: steps.fixed-capabilities-cache.outputs.cache-hit != 'true'
        with:
          name: rapidocr-runtime-darwin-arm64
          path: ${{ runner.temp }}/shejane-rapidocr-runtime-darwin
      - name: Build locked macOS fixed capabilities
        if: steps.fixed-capabilities-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SHEJANE_RAPIDOCR_RUNTIME_ASSET: ${{ runner.temp }}/shejane-rapidocr-runtime-darwin/rapidocr-runtime-darwin-arm64-a.shejane-runtime-asset
        run: |
          set -euo pipefail
          ./scripts/build-computer-use-builtin.sh
          ./scripts/build-browser-qa-builtin.sh
          ./scripts/build-ocr-builtin.sh
          output="${RUNNER_TEMP}/shejane-fixed-capabilities"
          mkdir -p "${output}"
          cp runtime/plugins/computer-use/dist/computer-use-0.2.2-darwin-arm64.shejane-plugin "${output}/"
          cp runtime/plugins/browser-qa/dist/browser-qa-0.1.3-darwin-arm64.shejane-plugin "${output}/"
          cp runtime/plugins/browser-qa/dist/browser-qa-runtime-1.61.1-darwin-arm64.shejane-runtime-asset "${output}/"
          cp runtime/plugins/ocr/dist/ocr-0.1.4-darwin-arm64.shejane-plugin "${output}/"
          cp runtime/plugins/ocr/dist/rapidocr-runtime-3.9.1-darwin-arm64.shejane-runtime-asset "${output}/"
      - name: Verify macOS fixed capability cache
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/shejane-fixed-capabilities"
          packages=(
            computer-use-0.2.2-darwin-arm64.shejane-plugin
            browser-qa-0.1.3-darwin-arm64.shejane-plugin
            ocr-0.1.4-darwin-arm64.shejane-plugin
          )
          for filename in "${packages[@]}"; do
            package="${output}/${filename}"
            test -f "${package}"
            uv run shejane-plugin inspect "${package}"
          done
          uv run python - "${output}" <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          from shejane_runtime.plugins.runtime_assets import RuntimeAssetStore

          root = Path(sys.argv[1])
          expected = {
              "browser-qa-runtime-1.61.1-darwin-arm64.shejane-runtime-asset": (
                  "org.shejane.browser-qa.runtime",
                  "1.61.1+chromium1228.3",
              ),
              "rapidocr-runtime-3.9.1-darwin-arm64.shejane-runtime-asset": (
                  "org.rapidocr.runtime",
                  "3.9.1+ppocrv6-small.2",
              ),
          }
          with tempfile.TemporaryDirectory(prefix="shejane-fixed-cache-") as temporary:
              store = RuntimeAssetStore(Path(temporary))
              for filename, identity in expected.items():
                  installed = store.install(root / filename, target_platform="darwin/arm64")
                  if (installed.asset_id, installed.version) != identity:
                      raise SystemExit(f"cached Runtime Asset identity mismatch: {filename}")
          PY
      - name: Save macOS fixed capabilities
        if: github.ref == 'refs/heads/main' && steps.fixed-capabilities-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/shejane-fixed-capabilities
          key: ${{ steps.fixed-capabilities-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: fixed-plugins-darwin-arm64
          path: ${{ runner.temp }}/shejane-fixed-capabilities
          if-no-files-found: error
          retention-days: 1

  windows-amd64-fixed-plugins:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Windows fixed capabilities
        id: fixed-capabilities-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/shejane-fixed-capabilities
          key: release-asset-v1-windows-amd64-fixed-capabilities-${{ hashFiles('pnpm-lock.yaml', 'runtime/pyproject.toml', 'runtime/uv.lock', 'runtime/src/shejane_runtime/plugins/**', 'scripts/build-browser-qa-windows-amd64.ps1', 'scripts/build-ocr-windows-amd64.ps1', 'runtime/plugins/browser-qa/**', 'runtime/plugins/ocr/**') }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock
      - name: Install workspace dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Install Runtime test dependencies
        working-directory: runtime
        run: uv sync --frozen
      - name: Build and execute locked Windows fixed capabilities
        if: steps.fixed-capabilities-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/build-ocr-windows-amd64.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/shejane-fixed-capabilities"
          ./scripts/build-browser-qa-windows-amd64.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/shejane-fixed-capabilities"
      - name: Verify Windows fixed capability cache
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "shejane-fixed-capabilities"
          @(
            "browser-qa-0.1.3-windows-amd64.shejane-plugin",
            "ocr-0.1.4-windows-amd64.shejane-plugin"
          ) | ForEach-Object {
            $package = Join-Path $output $_
            if (-not (Test-Path $package -PathType Leaf)) {
              throw "cached fixed capability is missing: $_"
            }
            uv run --project runtime shejane-plugin inspect $package
          }
          @'
          import sys
          import tempfile
          from pathlib import Path

          from shejane_runtime.plugins.runtime_assets import RuntimeAssetStore

          root = Path(sys.argv[1])
          expected = {
              "browser-qa-runtime-1.61.1-windows-amd64.shejane-runtime-asset": (
                  "org.shejane.browser-qa.runtime",
                  "1.61.1+chromium1228.3",
              ),
              "rapidocr-runtime-3.9.1-windows-amd64.shejane-runtime-asset": (
                  "org.rapidocr.runtime",
                  "3.9.1+ppocrv6-small.2",
              ),
          }
          with tempfile.TemporaryDirectory(prefix="shejane-fixed-cache-") as temporary:
              store = RuntimeAssetStore(Path(temporary))
              for filename, identity in expected.items():
                  installed = store.install(root / filename, target_platform="windows/amd64")
                  if (installed.asset_id, installed.version) != identity:
                      raise SystemExit(f"cached Runtime Asset identity mismatch: {filename}")
          '@ | uv run --project runtime python - $output
      - name: Save Windows fixed capabilities
        if: github.ref == 'refs/heads/main' && steps.fixed-capabilities-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/shejane-fixed-capabilities
          key: ${{ steps.fixed-capabilities-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: fixed-plugins-windows-amd64
          path: ${{ runner.temp }}/shejane-fixed-capabilities
          if-no-files-found: error
          retention-days: 1

  darwin-arm64-speech-model:
    if: inputs.extended_asset_verification == true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Fetch locked Whisper sources and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          lock="runtime/plugins/speech/runtime-assets/whisper-1.8.6.lock.json"
          inputs="${RUNNER_TEMP}/shejane-speech-model-inputs"
          mkdir -p "${inputs}"
          fetch() {
            local query="$1"
            local output="$2"
            curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
              "$(jq -r "${query}" "${lock}")" --output "${inputs}/${output}"
          }
          fetch '.whisper_cpp.source_url' whisper.cpp-v1.8.6.tar.gz
          fetch '.openai_whisper.source_url' openai-whisper-v20250625.tar.gz
          fetch '.checkpoint.source_url' large-v3-turbo.pt
      - name: Build canonical quantized Whisper model
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/shejane-speech-model-python"
          "${RUNNER_TEMP}/shejane-speech-model-python/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes \
            -r runtime/plugins/speech/runtime-assets/model-requirements-darwin-arm64.lock
          inputs="${RUNNER_TEMP}/shejane-speech-model-inputs"
          PATH="${RUNNER_TEMP}/shejane-speech-model-python/bin:${PATH}" \
          python runtime/plugins/speech/runtime-assets/build_model_darwin.py \
            --whisper-source "${inputs}/whisper.cpp-v1.8.6.tar.gz" \
            --openai-source "${inputs}/openai-whisper-v20250625.tar.gz" \
            --checkpoint "${inputs}/large-v3-turbo.pt" \
            --python "${RUNNER_TEMP}/shejane-speech-model-python/bin/python" \
            --output "${RUNNER_TEMP}/ggml-large-v3-turbo-q5_0.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-model-q5-0
          path: ${{ runner.temp }}/ggml-large-v3-turbo-q5_0.bin
          if-no-files-found: error

