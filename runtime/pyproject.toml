[project]
name = "shejane-runtime"
version = "0.1.0"
description = "SheJane Agent Runtime (Python + LangGraph + Deep Agents)"
authors = [{ name = "TAO LIANG", email = "tliang92@gmail.com" }]
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    # LangChain / LangGraph stack
    "langchain==1.3.12",
    "langchain-core==1.4.9",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain-mcp-adapters==0.3.0",
    "langchain-openai==1.3.5",
    "langchain-google-genai==4.2.7",
    "openai==2.45.0",
    "tiktoken>=0.12.0",
    # Subagents via deepagents (SubAgentMiddleware)
    "deepagents==0.6.12",
    # HTTP layer
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.28.0",
    # Misc utilities
    "pyperclip>=1.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "packaging==26.2",
    "jsonschema==4.26.0",
    "pyyaml>=6.0.0",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    "keyring>=25.6.0",
    # Document parsing. Known file extensions are validated at the trust
    # boundary, so the Runtime does not need MarkItDown's ONNX type detector.
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.2",
    "langchain-anthropic==1.4.8",
    "wasmtime==46.0.1",
    "cryptography==48.0.0",
    "pillow==12.2.0",
    "pycdlib==1.16.0",
    "a2a-sdk[fastapi]==1.1.2",
    "pyjwt[crypto]==2.12.1",
]

[project.scripts]
shejane-runtime = "shejane_runtime.__main__:main"
shejane-a2a-gateway = "shejane_runtime.a2a_gateway.__main__:main"
shejane-plugin = "shejane_runtime.plugin_cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["shejane_runtime*"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pyinstaller>=6.20.0",
    "zstandard==0.25.0",
]
package = [
    "pyinstaller>=6.20.0",
    "zstandard==0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "resilience: real process, disconnect, timeout, and crash recovery tests",
    "flow_p7_resume: LangGraph checkpoint and resume flow",
    "flow_p10_tool_hitl: Tool execution and human-in-the-loop flow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "E501",     # line length — handled separately
    "ASYNC230", # async open via aiofiles — out of scope, sync open is fine
    "ASYNC240", # sync os.path / pathlib in async — same rationale; we use
                # asyncio not anyio/trio so the rule's prescribed fix
                # (`anyio.path`) isn't applicable.
    "B007",     # unused loop variable — too noisy for ad-hoc DNS
                # resolution loops where the tuple shape comes from the
                # stdlib API we can't change.
    "RUF001",   # ambiguous-unicode chars in strings — we ship CJK
                # prompts, regex patterns matching fullwidth punctuation,
                # and en-dashes in prose. All intentional.
    "RUF002",   # same family but for docstrings
    "RUF003",   # same family but for comments
]
